<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">KunpiTech logo</title>
  <desc id="desc">KunpiTech trademark-style logo with a modern KT app mark and wordmark.</desc>
  <defs>
    <linearGradient id="markGradient" x1="16" x2="154" y1="16" y2="154" gradientUnits="userSpaceOnUse">
      <stop stop-color="#13B8A6"/>
      <stop offset=".36" stop-color="#B7D943"/>
      <stop offset=".68" stop-color="#F2B84B"/>
      <stop offset="1" stop-color="#EF5B4D"/>
    </linearGradient>
    <linearGradient id="shine" x1="40" x2="122" y1="20" y2="126" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#102027" flood-opacity=".16"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="18" y="18" width="134" height="134" rx="34" fill="url(#markGradient)"/>
    <path d="M42 42h86c-3 27-17 44-42 52l42 44H86L58 108v30H42V42Z" fill="#102027" opacity=".18"/>
    <path d="M50 46h22v39l37-39h29L95 90l46 44h-31L72 97v37H50V46Z" fill="#fff"/>
    <path d="M42 134h96" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".82"/>
    <path d="M42 30h50c25 0 45 20 45 45v5C95 61 62 70 31 101V41c0-6 5-11 11-11Z" fill="url(#shine)"/>
  </g>

  <g fill="#102027">
    <text x="184" y="97" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="900" letter-spacing="0">KunpiTech</text>
    <text x="188" y="132" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="4">ANDROID APP STUDIO</text>
    <text x="552" y="57" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900">TM</text>
  </g>
</svg>
